version: "3.9"

services:
  postgres:
    image: postgres:16-alpine
    container_name: techsters-kanban-db
    restart: unless-stopped
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: techsters_kanban
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data

  backend:
    build:
      context: ./backend
    container_name: techsters-kanban-backend
    restart: unless-stopped
    depends_on:
      - postgres
    environment:
      PORT: 5000
      DATABASE_URL: postgresql://postgres:postgres@postgres:5432/techsters_kanban?schema=public
      JWT_SECRET: techsters-avishkar26-super-secret-jwt-key
      CLIENT_URL: http://localhost:5173
    ports:
      - "5000:5000"

  frontend:
    build:
      context: ./frontend
    container_name: techsters-kanban-frontend
    restart: unless-stopped
    depends_on:
      - backend
    environment:
      VITE_API_URL: http://localhost:5000/api
      VITE_SOCKET_URL: http://localhost:5000
    ports:
      - "5173:5173"

volumes:
  pgdata:
